  <body>
    <main>
      <figure>
        <img src="page1.jpg" alt="Page 1" />

        <figcaption class="sr-only">
          <h1 id="page1-panel1" epub:type="panel">Panel 1</h1>
          <p id="page1-panel1-description">Pepper walks away from the house of the witches of Chaosah with a heavy backpack on her shoulders and Carrot attached to her leg. In the background, the three witches are standing on the front porch, looking sadly at Pepper.</p>
      
          <h1 id="page1-panel2" epub:type="panel">Panel 2</h1>
          <p id="page1-panel2-description">Cumin looks sadder than the rest of the witches and shakily addresses Pepper.</p>
          <p id="page1-panel2-bubble" epub:type="balloon">Cumin says: "But Pepper… Come back…"</p>
      
          <h1 id="page1-panel3" epub:type="panel">Panel 3</h1>
          <p id="page1-panel3-description">Pepper frowns and looks angrily over her shoulder.</p>
          <p id="page1-panel3-bubble1" epub:type="balloon">Pepper shouts: "NO! I'M LEAVING!!"</p>
          <p id="page1-panel3-bubble2" epub:type="balloon">Pepper says: "You don't teach real witchcraft! I'm going - to the witches of Ah!"</p>
      
          <h1 id="page1-panel4" epub:type="panel">Panel 4</h1>
          <p id="page1-panel4-description" epub:type="balloon">Pepper and Carrot fly away from the house on Pepper's broom, making a woosh sound as it reaches dark clouds in the sky.</p>
        </figcaption>
      </figure>
    </main>
