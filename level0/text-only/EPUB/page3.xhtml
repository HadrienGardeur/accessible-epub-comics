          <h1 id="page3-panel2" epub:type="panel">Panel 2</h1>
          <p id="page3-panel2-description">As they lay unconscious on a floor made of rocks covered with moss, Carrot dizziliy opens his eyes.</p>
          
          <h1 id="page3-panel3" epub:type="panel">Panel 3</h1>
          <p id="page3-panel3-description">Shocked by this vision, Carrot wakes Pepper up who stares at something from the corner of her eyes.</p>
          
          <h1 id="page3-panel4" epub:type="panel">Panel 4</h1>
          <p id="page3-panel4-description">Now sitting on a floor filled with the bones of other living creatures, Pepper faces a monster who's clearly thinking about them as its next meal.</p>
