          <h1 id="page7-panel1" epub:type="panel">Panel 1</h1>
          <p id="page7-panel1-description">Pepper, Shichimi and their companions are all sitting in the grass, enjoying a cup of hot tea while chatting.</p>
          <p id="page7-panel1-bubble1" epub:type="balloon">Pepper says: "… so there you are. Now you know the whole story."</p>
          <p id="page7-panel1-bubble2" epub:type="balloon">Shichimi replies: "… and you tell me that you're here because they haven't taught you anything?"</p>
        
          <h1 id="page7-panel2" epub:type="panel">Panel 2</h1>
          <p id="page7-panel2-description">Pepper and Carrot look back in astonishment, suddenly realizing that they couldn't have accomplished what they did without the lessons learned in Chaosah.</p>
      
          <h1 id="page7-panel3" epub:type="panel">Panel 3</h1>
          <p id="page7-panel3-description">Back in Chaosah, Pepper and Carrot hug all three witches on the front porch of their house. A happy ending for everyone, especially the three witches who can barely contain their surprise.</p>
