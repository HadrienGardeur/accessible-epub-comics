<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en">
  <head>
    <title>Page 2</title>
    <meta name="viewport" content="width=992, height=1373" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <figure>
        <img src="page2.jpg" alt="Page 2" />
        <figcaption class="sr-only">
          <h1 id="page2-panel1" epub:type="panel">Panel 1</h1>
          <p id="page2-panel1-description">Cumin looks away, while Cayenne and Thyme stare into the sky.</p>
          
          <h1 id="page2-panel2" epub:type="panel">Panel 2</h1>
          <p id="page2-panel2-description">Surrounded by dark clouds, Pepper floats on her broom, turning back towards Carrot who's hanging from her backpack.</p>
          <p id="page2-panel2-bubble1" epub:type="balloon">Pepper says: "Alright then, off to the land of the setting moons. Shichimi can tell us how to join the witches of Ah."</p>
          <p id="page2-panel2-bubble2" epub:type="balloon">"Carrot, get out the map and compass: it's too cloudy to see where I'm going"</p>
          
          <h1 id="page2-panel3" epub:type="panel">Panel 3</h1>
          <p id="page2-panel3-description">Mouth wide-opened, Carrot opens the backpack, grabs the map with his left paw and the compass with his right paw.</p>
          
          <h1 id="page2-panel4" epub:type="panel">Panel 4</h1>
          <p id="page2-panel4-description">Pepper looses control over her broom and as they both dive down, the content of her backpack is lost in the sky.</p>
          <p id="page2-panel4-bubble" epub:type="balloon">Pepper shouts: "DRATS! Turbulence! HOLD ON!"</p>
          
          <h1 id="page2-panel5" epub:type="panel">Panel 5</h1>
          <p id="page2-panel5-description">A dark tornado lies in front of them, as thunder strikes mere meters away from the broom.</p>
          <p id="page2-panel5-bubble" epub:type="balloon">Pepper shouts: "Oh no!!!"</p>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
